<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1A33; --navy-2:#182A50; --navy-ink:#E8EDF7; --navy-muted:#93A1BE;
  --bg:#F4F6FB; --paper:#FFFFFF; --ink:#141C2E; --muted:#5B6579; --line:#DFE4EE;
  --indigo:#4C5FD5; --indigo-soft:#E9ECFB; --mint:#1FA88E; --mint-soft:#E2F5F0; --amber:#B97F0E; --amber-soft:#FBF1DC;
  --term:#101A30; --term-ink:#DCE4F2; --term-dim:#7D8BA8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1222; --paper:#121C31; --ink:#E6EBF5; --muted:#98A3BA; --line:#24314D;
    --indigo:#8C9BFF; --indigo-soft:#1D2750; --mint:#4FD1B5; --mint-soft:#123A36; --amber:#E7B54A; --amber-soft:#3A2E14;
    --term:#08101F;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1222; --paper:#121C31; --ink:#E6EBF5; --muted:#98A3BA; --line:#24314D;
  --indigo:#8C9BFF; --indigo-soft:#1D2750; --mint:#4FD1B5; --mint-soft:#123A36; --amber:#E7B54A; --amber-soft:#3A2E14;
  --term:#08101F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 "IBM Plex Sans KR",system-ui,sans-serif;word-break:keep-all;overflow-x:clip;-webkit-font-smoothing:antialiased}
code,pre{font-family:"JetBrains Mono","IBM Plex Sans KR",ui-monospace,monospace}
a{color:var(--indigo)}
strong{font-weight:700}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:4px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* ── 내비게이션: 히어로와 같은 남색으로 이어짐 ───────── */
.topnav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--navy) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.06)}
.topnav .wrap{display:flex;align-items:center;gap:24px;height:60px}
.topnav .brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy-ink);text-decoration:none;white-space:nowrap;font-size:15px}
.topnav .brand svg{flex:none}
.topnav ul{list-style:none;margin:0 0 0 auto;padding:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.topnav ul::-webkit-scrollbar{display:none}
.topnav ul a{position:relative;display:block;padding:8px 12px;color:var(--navy-muted);text-decoration:none;white-space:nowrap;font-size:14.5px;transition:color .2s}
.topnav ul a:hover{color:var(--navy-ink)}
.topnav ul a::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--mint);transform:scaleX(0);transition:transform .25s}
.topnav ul a.on{color:var(--navy-ink)}
.topnav ul a.on::after{transform:scaleX(1)}
@media (max-width:640px){.topnav .brand span{display:none}.topnav ul{margin-left:0}}

/* ── 히어로 ───────── */
.hero{margin:0 calc(50% - 50vw);background:radial-gradient(1200px 500px at 85% 0%,var(--navy-2),var(--navy) 60%);color:var(--navy-ink);overflow:hidden}
.hero-in{max-width:880px;margin:0 auto;padding:72px 16px 0;position:relative}
.hero .meeting{display:inline-flex;align-items:center;gap:8px;margin:0 0 28px;font-size:14px;color:var(--navy-muted);letter-spacing:.01em}
.hero .meeting::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 4px rgba(31,168,142,.25)}
.hero h1{font-size:clamp(2.4rem,7.2vw,4.6rem);line-height:1.12;margin:0 0 20px;font-weight:700;letter-spacing:-.035em}
.hero h1 em{font-style:normal;font-weight:300;color:var(--navy-muted)}
.hero .by{margin:0;color:var(--navy-muted);font-size:15px}
.hero .by b{color:var(--navy-ink);font-weight:500}
.graph{display:block;width:100%;height:auto;margin-top:40px}
.graph .ln{fill:none;stroke-width:3;stroke-linecap:round}
.graph .main{stroke:#3A4C78}
.graph .feat{stroke:var(--mint)}
.graph .dot{fill:var(--navy);stroke-width:3}
.graph text{font:500 12px "JetBrains Mono",monospace;fill:var(--navy-muted)}
@media (prefers-reduced-motion:no-preference){
  .graph .feat{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.6s .3s cubic-bezier(.6,0,.2,1) forwards}
  .graph .late{opacity:0;animation:fade .4s 1.7s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
}

/* ── 장 제목: 실제 진행 순서라 번호를 붙임 ───────── */
main{counter-reset:ch}
main h2{counter-increment:ch;font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.25;letter-spacing:-.025em;margin:120px 0 28px;padding-top:28px;border-top:1px solid var(--line)}
main h2::before{content:"Part " counter(ch);display:block;font:500 13px "JetBrains Mono",monospace;color:var(--indigo);margin-bottom:10px;letter-spacing:.02em}
main h3{font-size:1.2rem;margin:56px 0 12px;line-height:1.45;letter-spacing:-.01em}
main p{margin:0 0 14px;max-width:66ch}
.lead{font-size:clamp(1.25rem,3vw,1.5rem);font-weight:300;line-height:1.55;letter-spacing:-.01em;margin-bottom:18px!important}
.lead + p strong{background:linear-gradient(transparent 62%,var(--mint-soft) 0)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin:16px 0}

ul.reasons{list-style:none;padding:0;margin:18px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
ul.reasons li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 20px 20px 52px;font-weight:500;line-height:1.55;position:relative}
ul.reasons li::before{content:"";position:absolute;left:20px;top:22px;width:18px;height:18px;border-radius:50%;background:var(--mint-soft);border:5px solid var(--mint);box-sizing:border-box}

ul.files{list-style:none;margin:18px 0;padding:8px 0;background:var(--term);border-radius:16px;font:14px/1.6 "JetBrains Mono","IBM Plex Sans KR",monospace;color:var(--term-ink)}
ul.files li{padding:9px 24px;display:flex;gap:12px}
ul.files li::before{content:"📄";filter:grayscale(1);opacity:.6}
ul.files li:last-child{background:rgba(231,181,74,.08);color:#E7B54A}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.pair .card{margin:0;display:flex;flex-direction:column;gap:6px}
.pair strong{font-size:1.25rem;letter-spacing:-.01em}
.pair small{color:var(--muted);font-size:15px;line-height:1.65}
.pair .tag{align-self:flex-start;font:500 12px "JetBrains Mono",monospace;padding:3px 10px;border-radius:999px;background:var(--indigo-soft);color:var(--indigo)}

blockquote{position:relative;margin:28px 0;padding:34px 34px 26px;background:var(--navy);color:var(--navy-ink);border-radius:18px;font-size:clamp(1.05rem,2.4vw,1.2rem);line-height:1.85;font-weight:300}
blockquote::before{content:"“";position:absolute;top:-6px;left:26px;font:700 72px/1 Georgia,serif;color:var(--mint)}
blockquote p{margin:0 0 10px;max-width:none}
blockquote p:last-child{margin:14px 0 0;font-size:14px;color:var(--navy-muted);font-weight:400}

.stat{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 0;font-variant-numeric:tabular-nums}
.stat s{font-size:1.6rem;font-weight:500;color:var(--muted);text-decoration-thickness:1.5px}
.stat i{font-style:normal;color:var(--muted)}
.stat b{font-size:2.6rem;line-height:1;letter-spacing:-.03em;color:var(--indigo)}

dl{margin:18px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
dl dt,dl dd{margin:0}
dl dt{font:700 16px "JetBrains Mono",monospace;color:var(--indigo);background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:18px 20px 4px}
dl dd{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;padding:0 20px 18px;color:var(--ink);font-size:15.5px;line-height:1.65}
/* dt/dd 쌍을 한 칸에 두기 */
@supports (grid-template-rows:subgrid){
  dl{grid-auto-flow:column;grid-template-rows:auto auto;grid-template-columns:none;grid-auto-columns:minmax(0,1fr)}
}
@media (max-width:640px){dl{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:1fr;gap:0}dl dd{margin-bottom:12px}}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:15.5px;margin:18px 0;background:var(--paper);border:1px solid var(--line);border-radius:16px}
@media (max-width:640px){table{display:block;overflow-x:auto}}
thead th{font-size:13px;font-weight:500;color:var(--muted);background:color-mix(in srgb,var(--bg) 60%,var(--paper));white-space:nowrap}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.65}
tbody tr:last-child td{border-bottom:0}
td code{display:inline-block;background:var(--indigo-soft);color:var(--indigo);padding:3px 9px;border-radius:6px;font-size:13.5px;font-weight:500;white-space:nowrap}
.yes,.nope{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.yes{background:var(--mint-soft);color:var(--mint)}
.nope{background:var(--line);color:var(--muted)}

/* push / pull 흐름 */
.track{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 22px;margin:18px 0;text-align:center}
.node{display:flex;flex-direction:column;align-items:center;gap:8px}
.node i{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--indigo-soft);color:var(--indigo);font-style:normal;font-size:22px}
.node.hub i{background:var(--navy);color:#fff}
.node b{font-weight:700}
.node small{font:12.5px "JetBrains Mono",monospace;color:var(--muted)}
.edge{position:relative;min-width:90px;height:2px;background:var(--line);margin:0 6px 40px}
.edge span{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font:600 13px "JetBrains Mono",monospace;color:var(--mint);white-space:nowrap}
.edge::after{content:"";position:absolute;right:-2px;top:-4px;border:5px solid transparent;border-left:7px solid var(--line)}
@media (max-width:640px){
  .track{grid-template-columns:1fr;gap:6px}
  .edge{width:2px;height:44px;min-width:0;margin:0 auto}
  .edge span{left:14px;top:12px;transform:none}
  .edge::after{right:-4px;top:auto;bottom:-6px;border:5px solid transparent;border-top:7px solid var(--line)}
}

/* 코드 블록 */
div.highlighter-rouge,pre{position:relative}
pre{background:var(--term);color:var(--term-ink);border-radius:16px;padding:22px 24px;font-size:14.5px;line-height:1.9;overflow-x:auto;margin:18px 0}
pre .c,pre .c1{color:var(--term-dim)}
pre .nb,pre .k{color:#9FB0FF}
pre .s,pre .s2,pre .s1{color:#7EE2C8}
p code,li code{background:var(--indigo-soft);color:var(--indigo);padding:2px 7px;border-radius:5px;font-size:.88em}
.copy{position:absolute;top:12px;right:12px;font:500 12.5px "IBM Plex Sans KR",sans-serif;background:rgba(255,255,255,.08);color:var(--term-ink);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:5px 12px;cursor:pointer;transition:background .2s}
.copy:hover{background:rgba(255,255,255,.16)}

/* git status 시뮬레이터 */
.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 14px}
.zone{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:170px;border-top:4px solid var(--amber)}
.zone.staged{border-top-color:var(--mint)}
.zone h4{margin:0 0 4px;font:700 13.5px "JetBrains Mono",monospace;color:var(--amber)}
.zone.staged h4{color:var(--mint)}
.zone p{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.55}
.chip{display:block;font:500 13.5px "JetBrains Mono",monospace;padding:6px 10px;border-radius:8px;margin:5px 0;background:var(--amber-soft);color:var(--amber)}
.zone.staged .chip{background:var(--mint-soft);color:var(--mint)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls button{font:500 14px "JetBrains Mono","IBM Plex Sans KR",monospace;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.controls button:hover{border-color:var(--indigo);color:var(--indigo)}
.controls #b-commit{background:var(--navy);color:#fff;border-color:var(--navy)}
.controls #b-commit:hover{background:var(--indigo);border-color:var(--indigo);color:#fff}
.controls output{font-size:14px;color:var(--muted)}
.commits{font:13.5px "JetBrains Mono","IBM Plex Sans KR",monospace;margin:14px 0 0;padding:0;list-style:none;color:var(--muted)}
.commits li{padding:4px 0 4px 22px;position:relative}
.commits li::before{content:"";position:absolute;left:3px;top:12px;width:10px;height:10px;border-radius:50%;border:2px solid var(--indigo)}

.qna{margin:120px calc(50% - 50vw) 0;background:var(--navy);color:var(--navy-ink);text-align:center;padding:96px 16px 110px}
.qna strong{display:block;font-size:clamp(3.2rem,11vw,6rem);line-height:1;letter-spacing:-.04em;margin-bottom:16px}
.qna p{margin:0 auto;color:var(--navy-muted)}

@media (max-width:640px){
  .pair,.sim{grid-template-columns:1fr}
  .card{padding:20px}
  main h2{margin-top:88px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<nav class="topnav" aria-label="목차">
  <div class="wrap">
    <a class="brand" href="#top">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="5" cy="5" r="3" fill="none" stroke="#4FD1B5" stroke-width="2"/><circle cx="5" cy="17" r="3" fill="none" stroke="#93A1BE" stroke-width="2"/><circle cx="17" cy="9" r="3" fill="none" stroke="#4FD1B5" stroke-width="2"/><path d="M5 8v6M17 12c0 3-12 1-12 2" fill="none" stroke="#93A1BE" stroke-width="2"/></svg>
      <span>GitHub와 친해지기</span>
    </a>
    <ul>
      <li><a href="#ch1">깃허브란?</a></li>
      <li><a href="#ch2">올리고 내려받기</a></li>
      <li><a href="#ch3">깃허브 탐색</a></li>
      <li><a href="#ch4">REA 체험</a></li>
      <li><a href="#qna">QnA</a></li>
    </ul>
  </div>
</nav>

<main class="wrap" id="top">
{{ content }}
</main>

<script>
// 코드 블록마다 복사 버튼
document.querySelectorAll('main pre').forEach(pre=>{
  const btn=document.createElement('button');
  btn.type='button';btn.className='copy';btn.textContent='복사';
  btn.onclick=()=>navigator.clipboard.writeText(pre.querySelector('code')?.innerText.trim()||pre.innerText.trim())
    .then(()=>{btn.textContent='복사됨';setTimeout(()=>btn.textContent='복사',1500)});
  pre.appendChild(btn);
});

// 현재 보고 있는 장을 내비게이션에 표시
const links=[...document.querySelectorAll('.topnav ul a')];
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  links.forEach(a=>a.classList.toggle('on',a.hash==='#'+e.target.id));
}),{rootMargin:'-30% 0px -60% 0px'});
links.forEach(a=>{const t=document.getElementById(a.hash.slice(1));if(t) io.observe(t)});

// git status 시뮬레이터 (페이지에 있을 때만)
if(document.getElementById('b-add')){
  const st={untracked:['index.md','_config.yml'],modified:[],staged:[]};
  let tracked=[],n=0;
  const $=id=>document.getElementById(id),msg=$('sim-msg');
  const render=()=>{for(const k in st) $('z-'+k).innerHTML=st[k].map(f=>`<span class="chip">${f}</span>`).join('')};
  $('b-edit').onclick=()=>{
    if(!tracked.length){msg.textContent='아직 커밋된 파일이 없어요. 먼저 add와 commit을 해 보세요.';return}
    const f=tracked[n++%tracked.length];
    if(!st.modified.includes(f)&&!st.staged.includes(f)) st.modified.push(f);
    msg.textContent=f+' 파일을 수정했어요.';render();
  };
  $('b-add').onclick=()=>{
    const moved=[...st.untracked,...st.modified];
    if(!moved.length){msg.textContent='스테이징할 변경 사항이 없어요.';return}
    st.staged.push(...moved);st.untracked=[];st.modified=[];
    msg.textContent=moved.length+'개 파일을 장바구니에 담았어요.';render();
  };
  $('b-commit').onclick=()=>{
    if(!st.staged.length){msg.textContent='nothing to commit: 먼저 git add를 하세요.';return}
    st.staged.forEach(f=>{if(!tracked.includes(f))tracked.push(f)});
    const li=document.createElement('li');
    li.textContent=st.staged.join(', ')+' 버전 기록';
    $('commits').prepend(li);
    msg.textContent='버전이 기록됐어요.';st.staged=[];render();
  };
  render();
}
</script>
</body>
</html>
